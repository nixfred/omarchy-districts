name: Model and state checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python3 -m unittest discover -s tests -p 'test_bridge.py'
      - run: node tests/model.js
      - run: node tests/camera.js
      - run: node tests/groups.js
