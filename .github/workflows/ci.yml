name: Model and state checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python3 tools/check-project.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Geometry, camera, grouping, activity, agents and navigation
        run: |
          for suite in model camera groups activity orbit agents_city navigation lens provider_legend; do
            node "tests/$suite.js"
          done
      - name: Local recovery clock, rollover and DST
        run: |
          TZ=UTC node tests/provider_timezone.js
          TZ=America/New_York node tests/provider_timezone.js
